services:
  # ============================================================================
  # 1. MySQL Database Service
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: ojt4_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password_123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./OJT4_CNTT3/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secure_password_123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  # ============================================================================
  # 2. PhpMyAdmin - Web Database Management UI
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ojt4_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_123}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8085}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  # ============================================================================
  # 3. Backend Service (Spring Boot 4 / Java 21)
  # ============================================================================
  backend:
    build:
      context: ./OJT4_CNTT3
      dockerfile: Dockerfile
    container_name: ojt4_backend
    restart: always
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-app_db}
      DB_USERNAME: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password_123}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  # ============================================================================
  # 4. Frontend Service (React Vite + Nginx)
  # ============================================================================
  frontend:
    build:
      context: "./Shopping App 2"
      dockerfile: Dockerfile
    container_name: ojt4_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - app_network

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  mysql_data:
    name: ojt4_mysql_data

networks:
  app_network:
    name: ojt4_network
    driver: bridge
