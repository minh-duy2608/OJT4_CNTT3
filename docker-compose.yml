services:
  # ============================================================================
  # MySQL Database Service
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: ojt4_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password_123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # Persistent volume for MySQL data
      - mysql_data:/var/lib/mysql
      # Initialization scripts run automatically on first container start
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secure_password_123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  # ============================================================================
  # PhpMyAdmin - Web Database Management UI
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ojt4_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_123}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8085}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

# ==============================================================================
# Persistent Volumes & Networks Definition
# ==============================================================================
volumes:
  mysql_data:
    name: ojt4_mysql_data

networks:
  app_network:
    name: ojt4_network
    driver: bridge
