name: CI/CD Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Build & Push Backend Spring Boot (Java 21) song song với Cache GHA
  # ============================================================================
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./OJT4_CNTT3
          file: ./OJT4_CNTT3/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ojt4-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Build & Push Frontend ReactJS (Vite + Nginx) song song
  # ============================================================================
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Shopping App 2
          file: ./Shopping App 2/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ojt4-frontend:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '' }}
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.VITE_CLOUDINARY_CLOUD_NAME || 'dnjubw5ta' }}
            VITE_CLOUDINARY_UPLOAD_PRESET=${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET || 'OJT_hoangson' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Kéo Image và Tái khởi động Container trên VPS qua SSH
  # ============================================================================
  deploy-to-vps:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare docker-compose.yml
        run: |
          echo "COMPOSE_B64=$(base64 -w 0 docker-compose.yml)" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: COMPOSE_B64,DOCKER_USERNAME
          script: |
            set -e
            APP_DIR="/root/app"
            mkdir -p $APP_DIR
            cd $APP_DIR

            # Cập nhật ngay file docker-compose.yml từ Git qua SSH
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml

            # Tạo file .env nếu chưa có để Docker Compose nhận DOCKER_USERNAME
            if [ ! -f .env ]; then
              touch .env
            fi
            if ! grep -q "^DOCKER_USERNAME=" .env; then
              echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
            else
              sed -i "s/^DOCKER_USERNAME=.*/DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}/" .env
            fi

            # Tự động đồng bộ đồng hồ hệ thống VPS (tránh lệch thời gian)
            echo "==> Đồng bộ đồng hồ hệ thống VPS..."
            timedatectl set-timezone Asia/Ho_Chi_Minh 2>/dev/null || true
            timedatectl set-ntp true 2>/dev/null || true

            # Khởi chạy hạ tầng Database trước
            echo "==> Khởi động hạ tầng cơ sở dữ liệu (MySQL & phpMyAdmin)..."
            docker compose up -d mysql phpmyadmin

            # Kéo Docker Image mới nhất với retry
            echo "==> Kéo image mới nhất từ Docker Hub..."
            pull_with_retry() {
              local img=$1
              for i in 1 2 3; do
                echo "Đang kéo $img (lần thử $i)..."
                if docker pull "$img"; then
                  echo "Kéo $img thành công!"
                  return 0
                else
                  echo "Lần $i thất bại cho $img, thử lại sau 3 giây..."
                  sleep 3
                fi
              done
              echo "Không thể kéo $img sau 3 lần thử!"
              return 1
            }

            pull_with_retry "${{ secrets.DOCKER_USERNAME }}/ojt4-backend:latest"
            pull_with_retry "${{ secrets.DOCKER_USERNAME }}/ojt4-frontend:latest"

            # Tái khởi động Backend & Frontend với image mới nhất
            echo "==> Cập nhật và chạy lại Backend & Frontend..."
            docker compose up -d --no-deps --force-recreate backend frontend

            # Dọn dẹp images rác/cũ để giải phóng dung lượng ổ cứng VPS
            echo "==> Dọn dẹp images cũ..."
            docker image prune -f

            echo "==> Triển khai thành công!"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

