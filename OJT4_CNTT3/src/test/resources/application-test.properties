# ==============================================================================
# Test Environment Configuration Profile: test
# ==============================================================================
spring.application.name=ojt4-backend-test

# Logging Configuration for Tests
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# In-memory H2 database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT configuration for tests
application.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.jwt.expiration-ms=86400000
application.jwt.refresh-expiration-ms=604800000
application.jwt.reset-password-expiration-ms=900000
application.jwt.email-verification-expiration-ms=86400000
